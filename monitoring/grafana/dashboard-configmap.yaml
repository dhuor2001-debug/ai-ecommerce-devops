apiVersion: v1
data:
  ecommerce.json: '{"uid": "ecommerce-overview", "title": "E-Commerce Platform Overview", "tags": ["ecommerce"], "timezone": "browser", "schemaVersion": 39, "version": 1, "refresh": "30s", "time": {"from": "now-1h", "to": "now"}, "panels": [{"id": 1, "title": "Application Availability", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w": 6, "h": 5}, "targets": [{"refId": "A", "expr": "avg(up{job=~\"ecommerce-backend|ecommerce-pods\"}) * 100", "legendFormat": "availability", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 50}, {"color": "green", "value": 99}]}}, "overrides": []}}, {"id": 2, "title": "Request Rate", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 6, "y": 0, "w": 9, "h": 5}, "targets": [{"refId": "A", "expr": "sum(rate(http_request_duration_seconds_count[5m]))", "legendFormat": "req/s", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}}, {"id": 3, "title": "p95 Latency", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 15, "y": 0, "w": 9, "h": 5}, "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}}, {"id": 4, "title": "CPU Usage", "type": "gauge", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 5, "w": 6, "h": 6}, "targets": [{"refId": "A", "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "node cpu %", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 70}, {"color": "red", "value": 85}]}}, "overrides": []}}, {"id": 5, "title": "Memory Usage", "type": "gauge", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 6, "y": 5, "w": 6, "h": 6}, "targets": [{"refId": "A", "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100", "legendFormat": "node memory %", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 75}, {"color": "red", "value": 90}]}}, "overrides": []}}, {"id": 6, "title": "Pod Status", "type": "bargauge", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 5, "w": 6, "h": 6}, "targets": [{"refId": "A", "expr": "sum by (phase) (kube_pod_status_phase{namespace=\"ecommerce\"})", "legendFormat": "{{phase}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {}, "overrides": []}}, {"id": 7, "title": "Node Status", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 18, "y": 5, "w": 6, "h": 6}, "targets": [{"refId": "A", "expr": "sum by (condition) (kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "legendFormat": "Ready", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {}, "overrides": []}}, {"id": 8, "title": "Resource Utilization - CPU by pod", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 11, "w": 12, "h": 7}, "targets": [{"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"ecommerce\",container!=\"\"}[5m]))", "legendFormat": "{{pod}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}}, {"id": 9, "title": "Resource Utilization - Memory by pod", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 11, "w": 12, "h": 7}, "targets": [{"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"ecommerce\",container!=\"\"})", "legendFormat": "{{pod}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"id": 10, "title": "Orders Created", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 18, "w": 8, "h": 5}, "targets": [{"refId": "A", "expr": "sum(increase(orders_created_total[1h]))", "legendFormat": "orders / hour", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {}, "overrides": []}}, {"id": 11, "title": "Node.js Event Loop Lag", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 8, "y": 18, "w": 16, "h": 5}, "targets": [{"refId": "A", "expr": "nodejs_eventloop_lag_seconds", "legendFormat": "{{instance}}{{pod}}", "datasource": {"type": "prometheus", "uid": "prometheus"}}], "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}}]}'
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: '1'
  name: ecommerce-dashboard
  namespace: monitoring
