# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/prometheus/values-kube-prometheus-stack.yaml
grafana:
  admin:
    existingSecret: grafana-admin          # kubectl -n monitoring create secret generic grafana-admin --from-literal=admin-user=admin --from-literal=admin-password=...
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL }
prometheus:
  prometheusSpec:
    retention: 7d
    # Scrape pods annotated with prometheus.io/scrape=true (the backend Deployment is annotated).
    additionalScrapeConfigs:
      - job_name: ecommerce-pods
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [ecommerce] } }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+) }
          - { source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: "([^:]+)(?::\\d+)?;(\\d+)", replacement: "$1:$2", target_label: __address__ }
          - { source_labels: [__meta_kubernetes_pod_label_app], target_label: app }
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
