groups:
  - name: ecommerce
    rules:
      - alert: BackendDown
        expr: up{job="ecommerce-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Backend target {{ $labels.instance }} is down" }

      - alert: HighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of requests are failing with 5xx" }

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "p95 latency above 1s" }

      - alert: HighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Node CPU above 85% for 10 minutes" }

      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Node memory above 90% for 10 minutes" }
