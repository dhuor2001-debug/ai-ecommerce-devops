image:
  registry: ghcr.io/your-org
  backendRepository: ecommerce-backend
  frontendRepository: ecommerce-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecret: ""        # name of a docker-registry Secret in the namespace (private registries)

backend:
  replicas: 3
  port: 3000
  logLevel: info
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

frontend:
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

database:
  name: shop
  user: shop
  storage: 5Gi
  # Name of an existing Secret holding POSTGRES_PASSWORD. If empty, the chart creates one
  # with a randomly generated password (kept across upgrades via lookup).
  existingSecret: ""

ingress:
  enabled: true
  className: nginx
  host: shop.example.com
  tls:
    enabled: false
    secretName: ecommerce-tls

networkPolicy:
  enabled: true

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
