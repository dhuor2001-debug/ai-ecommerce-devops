{{- if not .Values.database.existingSecret }}
{{- /* Re-use the existing password on upgrades so the DB credentials never rotate by accident. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "ecommerce-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
