# Lightweight CI (the report lists GitHub Actions as a CI alternative).
# Jenkins remains the primary CD engine; this gives fast PR feedback.
name: ci
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: application/backend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: application/backend
      - run: npm test
        working-directory: application/backend
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Dependency scan
        run: bash security/scan-dependencies.sh
