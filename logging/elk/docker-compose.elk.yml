# Centralized logging: Filebeat (collect) -> Logstash (parse) -> Elasticsearch (store) -> Kibana (investigate)
# DEMO CONFIG: Elasticsearch security is disabled and all ports bind to 127.0.0.1 only.
# For anything shared, enable xpack security + TLS and put Kibana behind the reverse proxy.
# Host prerequisite:  sudo sysctl -w vm.max_map_count=262144
name: ecommerce-logging
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits: { memlock: { soft: -1, hard: -1 } }
    volumes: [es_data:/usr/share/elasticsearch/data]
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    restart: unless-stopped
    environment: { LS_JAVA_OPTS: "-Xms256m -Xmx256m" }
    volumes: ["./logstash/pipeline:/usr/share/logstash/pipeline:ro"]
    depends_on: { elasticsearch: { condition: service_healthy } }

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    restart: unless-stopped
    environment: { ELASTICSEARCH_HOSTS: "http://elasticsearch:9200" }
    ports: ["127.0.0.1:5601:5601"]
    depends_on: { elasticsearch: { condition: service_healthy } }

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    restart: unless-stopped
    user: root                      # required to read container logs and the docker socket
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/hostlogs:ro
    depends_on: [logstash]

volumes:
  es_data: {}
