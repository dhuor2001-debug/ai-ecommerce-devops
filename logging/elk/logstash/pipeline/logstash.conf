input { beats { port => 5044 } }

filter {
  # The backend logs JSON (see application/backend/src/logger.js). Parse it into fields.
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
    if [app][level] { mutate { add_field => { "log_level" => "%{[app][level]}" } } }
  }

  # Normalise nginx access lines (combined format) from the web container
  if [container][image][name] =~ /ecommerce-frontend/ {
    grok {
      match => { "message" => '%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:nginx_time}\] "%{WORD:http_method} %{DATA:http_path} HTTP/%{NUMBER:http_version}" %{NUMBER:http_status:int} %{NUMBER:bytes:int}' }
      tag_on_failure => []
    }
  }

  mutate { remove_field => ["agent", "ecs", "input", "log"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ecommerce-logs-%{+YYYY.MM.dd}"
  }
}
