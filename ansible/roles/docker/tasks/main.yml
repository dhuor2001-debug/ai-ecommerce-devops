---
- name: Create apt keyring directory
  ansible.builtin.file: { path: /etc/apt/keyrings, state: directory, mode: "0755" }

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Configure Docker daemon (log rotation, no new privileges)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "no-new-privileges": true,
        "live-restore": true
      }
  notify: Restart docker

- name: Allow the application user to run docker
  ansible.builtin.user: { name: "{{ app_user }}", groups: docker, append: true }

- name: Start and enable Docker
  ansible.builtin.systemd: { name: docker, enabled: true, state: started }
