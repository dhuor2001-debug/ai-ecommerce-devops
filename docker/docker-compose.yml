# Local / single-VM multi-service environment.
# Run from the repo root:  docker compose --env-file .env -f docker/docker-compose.yml up -d --build
name: ecommerce

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: ecommerce-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shop}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend_net, frontend_net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: &json_logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
    image: ecommerce-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend: { condition: service_healthy }
    networks: [frontend_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *json_logs

networks:
  backend_net:
    internal: true      # database is unreachable from outside
  frontend_net: {}

volumes:
  db_data: {}
