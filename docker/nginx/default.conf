# Reverse proxy + static web server.
server_tokens off;

upstream backend_api {
    server backend:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location / { try_files $uri $uri/ =404; }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health { proxy_pass http://backend_api; proxy_set_header Host $host; }
    location = /ready  { proxy_pass http://backend_api; proxy_set_header Host $host; }

    # /metrics is for Prometheus (scraped directly from the backend), never exposed publicly.
    location = /metrics { return 404; }
}
